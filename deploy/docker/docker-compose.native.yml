name: flyfish-shop-native

x-app-build: &app-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile.native
  args:
    GRAAL_IMAGE: ${GRAAL_IMAGE:-container-registry.oracle.com/graalvm/native-image:25}
    ALINUX_IMAGE: ${ALINUX_IMAGE:-registry.cn-hangzhou.aliyuncs.com/alinux/alinux3:latest}
    NATIVE_MARCH: ${NATIVE_MARCH:-x86-64-v3}
    NATIVE_OPTIMIZATION_LEVEL: ${NATIVE_OPTIMIZATION_LEVEL:--O3}
    NATIVE_BUILD_PARALLELISM: ${NATIVE_BUILD_PARALLELISM:-2}
    NATIVE_BUILD_XMX: ${NATIVE_BUILD_XMX:-8g}

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: prod
  SPRING_R2DBC_URL: "${SPRING_R2DBC_URL:-r2dbc:mysql://mysql:3306/flyfish_dev?sslMode=DISABLED&serverZoneId=Asia/Shanghai}"
  SPRING_R2DBC_USERNAME: ${SPRING_R2DBC_USERNAME:-flyfish}
  SPRING_R2DBC_PASSWORD: ${SPRING_R2DBC_PASSWORD:-flyfish_dev_password}
  USER_JWT_SECRET: ${USER_JWT_SECRET:-change-me-flyfish-dev-jwt-secret}
  FLYFISH_PUBLIC_BASE_URL: ${FLYFISH_PUBLIC_BASE_URL:-http://127.0.0.1:9999}
  FLYFISH_AUTH_BASE_URL: ${FLYFISH_AUTH_BASE_URL:-http://auth:10080}
  OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:-http://127.0.0.1:9999/oauth/callback}
  EMAIL_MAGIC_LINK_BASE_URL: ${EMAIL_MAGIC_LINK_BASE_URL:-http://127.0.0.1:9999}
  TZ: ${TZ:-Asia/Shanghai}

x-app-service: &app-service
  image: ${FLYFISH_NATIVE_IMAGE:-flyfish-shop-native-app:latest}
  platform: ${FLYFISH_DOCKER_PLATFORM:-linux/amd64}
  build: *app-build
  depends_on:
    mysql:
      condition: service_healthy
  volumes:
    - flyfish_uploads:/app/data
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flyfish_dev}
      MYSQL_USER: ${MYSQL_USER:-flyfish}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flyfish_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flyfish_root_password}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - flyfish_mysql:/var/lib/mysql
    restart: unless-stopped

  auth:
    <<: *app-service
    environment:
      <<: *app-environment
      FLYFISH_APP: auth
      SERVER_PORT: 10080
      OAUTH_GITEA_SERVER: ${OAUTH_GITEA_SERVER:-https://git.example.com}
      OAUTH_GITEA_CLIENT_ID: ${OAUTH_GITEA_CLIENT_ID:-}
      OAUTH_GITEA_CLIENT_SECRET: ${OAUTH_GITEA_CLIENT_SECRET:-}
      OAUTH_GITEA_ADMIN_TOKEN: ${OAUTH_GITEA_ADMIN_TOKEN:-}
      OAUTH_GITEE_CLIENT_ID: ${OAUTH_GITEE_CLIENT_ID:-}
      OAUTH_GITEE_CLIENT_SECRET: ${OAUTH_GITEE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      EMAIL_MAGIC_LINK_ENABLED: ${EMAIL_MAGIC_LINK_ENABLED:-false}
      EMAIL_MAGIC_LINK_FROM: ${EMAIL_MAGIC_LINK_FROM:-}
      EMAIL_MAGIC_LINK_EXPIRES_IN: ${EMAIL_MAGIC_LINK_EXPIRES_IN:-15m}
      EMAIL_MAGIC_LINK_RESEND_COOLDOWN: ${EMAIL_MAGIC_LINK_RESEND_COOLDOWN:-120s}
      EMAIL_MAGIC_LINK_SUBJECT: ${EMAIL_MAGIC_LINK_SUBJECT:-飞鱼邮箱快速登录}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10080/portal/users/current >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${FLYFISH_AUTH_PORT:-10080}:10080"

  lowcode:
    <<: *app-service
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      <<: *app-environment
      FLYFISH_APP: lowcode
      SERVER_PORT: 10081
      LOWCODE_CACHE_PATH: ${LOWCODE_CACHE_PATH:-.cache/flyfish-lowcode}
      LOWCODE_GENERATOR_AUTHOR: ${LOWCODE_GENERATOR_AUTHOR:-flyfish}
      LOWCODE_GENERATOR_R2DBC_URL: ${LOWCODE_GENERATOR_R2DBC_URL:-r2dbc:mysql://mysql:3306/flyfish_dev}
      LOWCODE_GENERATOR_R2DBC_USERNAME: ${LOWCODE_GENERATOR_R2DBC_USERNAME:-flyfish}
      LOWCODE_GENERATOR_R2DBC_PASSWORD: ${LOWCODE_GENERATOR_R2DBC_PASSWORD:-flyfish_dev_password}
      LOWCODE_GENERATOR_PACKAGE_PARENT: ${LOWCODE_GENERATOR_PACKAGE_PARENT:-com.example.system}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10081/portal/capabilities >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${FLYFISH_LOWCODE_PORT:-10081}:10081"

  shop:
    <<: *app-service
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      <<: *app-environment
      FLYFISH_APP: shop
      SERVER_PORT: 10082
      WX_MP_APP_ID: ${WX_MP_APP_ID:-}
      WX_MP_SECRET: ${WX_MP_SECRET:-}
      WX_MP_TOKEN: ${WX_MP_TOKEN:-}
      WX_MP_AES_KEY: ${WX_MP_AES_KEY:-}
      WX_MP_CUSTOMER_SERVICE_MEDIA_ID: ${WX_MP_CUSTOMER_SERVICE_MEDIA_ID:-}
      WX_MP_QUICK_LOGIN_BASE_URL: ${WX_MP_QUICK_LOGIN_BASE_URL:-http://127.0.0.1:9999}
      WX_MP_PURCHASE_REDIRECT: ${WX_MP_PURCHASE_REDIRECT:-/shop/item-list}
      WX_MP_QUICK_LOGIN_EXPIRE_SECONDS: ${WX_MP_QUICK_LOGIN_EXPIRE_SECONDS:-900}
      H5ZHIFU_ENABLED: ${H5ZHIFU_ENABLED:-false}
      H5ZHIFU_API_BASE_URL: ${H5ZHIFU_API_BASE_URL:-https://open.h5zhifu.com/api}
      H5ZHIFU_APP_ID: ${H5ZHIFU_APP_ID:-}
      H5ZHIFU_KEY: ${H5ZHIFU_KEY:-}
      H5ZHIFU_NOTIFY_URL: ${H5ZHIFU_NOTIFY_URL:-http://127.0.0.1:9999/shops/payments/h5zhifu/notify}
      H5ZHIFU_DEFAULT_PAY_TYPE: ${H5ZHIFU_DEFAULT_PAY_TYPE:-wechat}
      H5ZHIFU_ENABLED_PAY_TYPES: ${H5ZHIFU_ENABLED_PAY_TYPES:-wechat}
      H5ZHIFU_DEFAULT_TRADE_TYPE: ${H5ZHIFU_DEFAULT_TRADE_TYPE:-native}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_DEFAULT_CURRENCY: ${STRIPE_DEFAULT_CURRENCY:-cny}
      STRIPE_PORTAL_BASE_URL: ${STRIPE_PORTAL_BASE_URL:-http://127.0.0.1:9999}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      STRIPE_CHECKOUT_EXPIRES_MINUTES: ${STRIPE_CHECKOUT_EXPIRES_MINUTES:-30}
      SHOP_PRICING_CNY_PER_USD: ${SHOP_PRICING_CNY_PER_USD:-6.78}
      SUPPORT_NOTIFICATION_ENABLED: ${SUPPORT_NOTIFICATION_ENABLED:-false}
      SUPPORT_NOTIFICATION_PORTAL_BASE_URL: ${SUPPORT_NOTIFICATION_PORTAL_BASE_URL:-http://127.0.0.1:9999}
      SUPPORT_NOTIFICATION_MAIL_ENABLED: ${SUPPORT_NOTIFICATION_MAIL_ENABLED:-false}
      SUPPORT_NOTIFICATION_MAIL_FROM: ${SUPPORT_NOTIFICATION_MAIL_FROM:-}
      SUPPORT_NOTIFICATION_MAIL_ADMIN_RECIPIENTS: ${SUPPORT_NOTIFICATION_MAIL_ADMIN_RECIPIENTS:-}
      SUPPORT_NOTIFICATION_WECHAT_ENABLED: ${SUPPORT_NOTIFICATION_WECHAT_ENABLED:-false}
      SUPPORT_NOTIFICATION_WECHAT_ADMIN_OPENIDS: ${SUPPORT_NOTIFICATION_WECHAT_ADMIN_OPENIDS:-}
      SUPPORT_NOTIFICATION_MAINTAINER_GITEA_OPENID: ${SUPPORT_NOTIFICATION_MAINTAINER_GITEA_OPENID:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10082/portal/capabilities >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${FLYFISH_SHOP_PORT:-10082}:10082"

  web:
    image: ${FLYFISH_WEB_IMAGE:-flyfish-shop-native-web:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    depends_on:
      auth:
        condition: service_healthy
      lowcode:
        condition: service_healthy
      shop:
        condition: service_healthy
    ports:
      - "${FLYFISH_HTTP_PORT:-9999}:80"
    restart: unless-stopped

volumes:
  flyfish_mysql:
  flyfish_uploads:
