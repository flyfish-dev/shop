name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check public source boundary
        run: python3 scripts/check-public-boundary.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        run: ./mvnw --batch-mode test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Build production bundle
        run: npm run build

      - name: Build low-code application
        run: npm run build:lowcode

      - name: Build single-origin Docker frontend
        run: npm run build:docker

      - name: Check module boundaries
        run: npm run test:architecture

      - name: Check build artifacts
        run: npm run test:build-artifacts

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Smoke test routes
        run: npm run test:route-smoke

      - name: Build Xianyu miniapp candidate
        run: npm run build:xianyu
